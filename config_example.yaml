# Основные бизнес-настройки Ace Place. Секреты API остаются в .env.
timezone: Asia/Seoul
calendar:
  json_dir: secrets/calendars
  enabled: false
  booking_color_id: "9"
  cleaning_color_id: "6"
  block_color_id: "8"
currency: KRW
cancellation:
  refund_cutoff_hours: 72 # Менее 72 часов: удерживается только полученная предоплата, остаток возвращается.
reviews:
  enabled: false
  url: "https://t.me/AcePlaceParty/112"
  catch_up_hours: 24 # Доставить ранее назначенное сообщение после простоя, если прошло не более 24 часов.
  ru:
    link_text: "⭐ Оставить отзыв"
    message: |-
      Спасибо, что выбрали AcePlace! 🎉
      Надеемся, вы отлично провели время.

      Поделитесь впечатлениями — ваш отзыв поможет нам стать лучше и другим гостям выбрать место для своего мероприятия.

      {review_link}

      Будем рады видеть вас снова! 💛
  ko:
    link_text: "⭐ 후기 남기기"
    message: |-
      AcePlace를 이용해 주셔서 감사합니다! 🎉
      즐거운 시간 보내셨기를 바랍니다.

      이용 후기를 남겨 주세요. 여러분의 후기는 더 나은 서비스를 만드는 데 도움이 되고, 다른 손님들이 행사 장소를 선택하는 데에도 큰 도움이 됩니다.

      {review_link}

      다시 뵙기를 기다리겠습니다! 💛
notifications:
  cleaning:
    hours_before: 1 # За сколько часов до назначенной уборки уведомлять администраторов.
    telegram_enabled: true
visit:
  # Отправляется клиенту вместе с подтверждением брони.
  # route_url пока не задан.
  ru:
    address: '경기 안산시 단원구 중앙대로 829 — здание свадебного зала «The Luce», этаж B1.'
    route_url: ""
    entry_instructions: |-
      На этаже B1 после выхода из лифта поверните направо.

      Парковка находится в этом же здании на этажах B2 и B3. Вместимость — около 1000 автомобилей.
      Зарегистрируйте автомобиль в управляющем офисе (관리사무실) до 17:00, пока он работает.
      После регистрации первые 2,5 часа парковки бесплатны, далее — 600 ₩ за каждые 30 минут.
      Примеры стоимости: 3 часа — 600 ₩, 4 часа — 1 800 ₩, 5 часов — 3 000 ₩.
      По воскресеньям парковка полностью бесплатная, но регистрация автомобиля обязательна. Из-за свадеб свободных мест может не быть.
  ko:
    address: '경기 안산시 단원구 중앙대로 829, "The Luce" 웨딩홀 건물 지하 1층(B1).'
    route_url: ""
    entry_instructions: |-
      지하 1층(B1)에서 엘리베이터를 내린 후 오른쪽으로 오시면 됩니다.

      주차장은 같은 건물 지하 2층(B2)과 지하 3층(B3)에 있으며, 약 1,000대 주차가 가능합니다.
      관리사무실 운영 시간인 오후 5시(17:00)까지 차량을 등록해 주세요.
      차량 등록 시 최초 2시간 30분은 무료이며, 이후 30분당 600원이 부과됩니다.
      요금 예시: 3시간 600원, 4시간 1,800원, 5시간 3,000원.
      일요일에는 주차가 전면 무료이지만 차량 등록은 필수입니다. 예식으로 인해 주차 공간이 부족할 수 있습니다.
booking:
  minimum_hours: 5
  start_step_minutes: 60
  confirmation_timeout_minutes: 1440
  hold_timeout_minutes: 10
pricing:
  base_hours: 5
  weekday_base_amount: 150000
  weekday_extra_hour_amount: 10000
  weekend_holiday_base_amount: 200000
  weekend_holiday_extra_hour_amount: 20000
  weekend_days: [SAT, SUN]
  # Вся аренда и дополнительные часы — по дате начала в Сеуле.
  date_policy: start_date
  # Праздники Южной Кореи и переносы рассчитываются библиотекой holidays автоматически.
  # Здесь можно добавить свои даты повышенного тарифа; они дополняют календарь KR.
  holiday_dates: []
  # Пример (заменить строку holiday_dates выше):
  # holiday_dates:
  #   - "2027-11-04"

cleaning:
  policy: next_start_time
  duration_minutes: 120
  # Разрешённые старты уборки (Asia/Seoul), а не время её окончания.
  # null — расписание неизвестно; [] — в этот день уборка не начинается.
  weekly:
    MON: ["09:00", "14:00"]
    TUE: ["09:00", "14:00"]
    WED: ["09:00", "14:00"]
    THU: ["09:00", "14:00"]
    FRI: ["09:00", "14:00"]
    SAT: ["09:00", "14:00"]
    SUN: ["09:00", "14:00"]
payment:
  deposit_amount: 50000
  bank: "Bank name"
  account_number: "30..."
  account_holder: "NAME"

# Регулярные блокировки: уроки, мероприятия и другие запланированные занятия.
# Блокировки в БД и недельные серии Google Calendar обновляются автоматически.
books_plans:
  enabled: false
  timezone: Asia/Seoul
  generate_days_ahead: 90
  weekly:
    MON: []
    # Чтобы включить несколько диапазонов, замените MON: [] на:
    # MON:
    #   - from: "10:00"
    #     to: "12:00"
    #   - from: "14:00"
    #     to: "16:00"
    TUE: []
    WED: []
    THU: []
    FRI: []
    SAT: []
    SUN: []
  excluded_dates: []
  # Пример исключений (заменить строку excluded_dates выше):
  # excluded_dates:
  #   - "2026-12-25"
