information:
  address_parking:
    ru: |-
      Мы находимся в здании «The Luce» Wedding Hall по адресу: 경기 안산시 단원구 중앙대로 829, на этаже B1. При выходе из лифта вход направо.

      Парковка находится в этом же здании на этажах B2 и B3. Зарегистрировать автомобиль можно до 17:00, пока работает офис управления зданием (관리사무실). После регистрации первые 4 часа бесплатны, далее — 600 ₩ за каждые 30 минут.

      В воскресенье парковка полностью бесплатная, но автомобиль также нужно зарегистрировать. Из-за свадеб свободных мест может быть меньше.
    ko: |-
      The Luce 웨딩홀 건물 지하 1층(B1)에 있습니다. 주소: 경기 안산시 단원구 중앙대로 829. 엘리베이터에서 내리신 후 오른쪽으로 오시면 됩니다.

      주차장은 같은 건물 지하 2층(B2)과 지하 3층(B3)에 있습니다. 차량 등록은 관리사무실 운영 시간인 오후 5시까지 가능합니다. 등록 후 최초 4시간은 무료이며, 이후 30분마다 600원이 부과됩니다.

      일요일은 주차가 종일 무료이지만 차량 등록은 필요합니다. 결혼식 행사로 인해 주차 공간이 부족할 수 있습니다.
    en: |-
      We are in The Luce Wedding Hall building at 경기 안산시 단원구 중앙대로 829, on level B1. Turn right when leaving the lift.

      Parking is in the same building on levels B2 and B3. Register your vehicle by 5:00 PM while the building management office (관리사무실) is open. After registration, the first 4 hours are free; additional parking costs ₩600 per 30 minutes.

      Parking is free all day on Sundays, but vehicle registration is still required. Spaces may be limited due to weddings.
