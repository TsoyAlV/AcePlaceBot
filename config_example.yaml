# Основные бизнес-настройки Ace Place. Секреты API остаются в .env.
timezone: Asia/Seoul
calendar:
  json_dir: secrets/calendars
  enabled: false
  booking_color_id: "9"
  cleaning_color_id: "6"
  block_color_id: "8"
currency: KRW
cancellation:
  refund_cutoff_hours: 72 # Менее 72 часов: удерживается только полученная предоплата, остаток возвращается.
notifications:
  cleaning:
    hours_before: 1 # За сколько часов до назначенной уборки уведомлять администраторов.
    telegram_enabled: true
visit:
  # Отправляется клиенту вместе с подтверждением брони.
  # route_url пока не задан.
  ru:
    address: '경기 안산시 단원구 중앙대로 829 — здание свадебного зала «The Luce», этаж B1.'
    route_url: ""
    entry_instructions: |-
      На этаже B1 после выхода из лифта поверните направо.

      Парковка находится в этом же здании на этажах B2 и B3. Вместимость — около 1000 автомобилей.
      Зарегистрируйте автомобиль в управляющем офисе (관리사무실) до 17:00, пока он работает.
      После регистрации первые 2,5 часа парковки бесплатны, далее — 600 ₩ за каждые 30 минут.
      Примеры стоимости: 3 часа — 600 ₩, 4 часа — 1 800 ₩, 5 часов — 3 000 ₩.
      По воскресеньям парковка полностью бесплатная, но регистрация автомобиля обязательна. Из-за свадеб свободных мест может не быть.
  ko:
    address: '경기 안산시 단원구 중앙대로 829, "The Luce" 웨딩홀 건물 지하 1층(B1).'
    route_url: ""
    entry_instructions: |-
      지하 1층(B1)에서 엘리베이터를 내린 후 오른쪽으로 오시면 됩니다.

      주차장은 같은 건물 지하 2층(B2)과 지하 3층(B3)에 있으며, 약 1,000대 주차가 가능합니다.
      관리사무실 운영 시간인 오후 5시(17:00)까지 차량을 등록해 주세요.
      차량 등록 시 최초 2시간 30분은 무료이며, 이후 30분당 600원이 부과됩니다.
      요금 예시: 3시간 600원, 4시간 1,800원, 5시간 3,000원.
      일요일에는 주차가 전면 무료이지만 차량 등록은 필수입니다. 예식으로 인해 주차 공간이 부족할 수 있습니다.
booking:
  minimum_hours: 5
  start_step_minutes: 60
  confirmation_timeout_minutes: 180
  hold_timeout_minutes: 10
pricing:
  base_hours: 5
  weekday_base_amount: 150000
  weekday_extra_hour_amount: 10000
  weekend_holiday_base_amount: 200000
  weekend_holiday_extra_hour_amount: 20000
  weekend_days: [SAT, SUN]
  # Вся аренда и дополнительные часы — по дате начала в Сеуле.
  date_policy: start_date
  # Южная Корея, 2026. Проверено 2026-11-03, включая переносы и день выборов.
  # https://www.bok.or.kr/eng/main/contents.do?menuNo=400373
  # https://www.customs.go.kr/engportal/cm/cntnts/cntntsView.do?cntntsId=7401&mi=13284
  # При назначении дополнительных временных праздников список нужно обновить.
  holiday_dates:
    - 2026-01-01 # Новый год
    - 2026-02-16 # Seollal
    - 2026-02-17
    - 2026-02-18
    - 2026-03-01 # День движения за независимость
    - 2026-03-02 # Перенос
    - 2026-05-01 # День труда
    - 2026-05-05 # День детей
    - 2026-05-24 # День рождения Будды
    - 2026-05-25 # Перенос
    - 2026-06-03 # Местные выборы
    - 2026-06-06 # День памяти
    - 2026-07-17 # День конституции
    - 2026-08-15 # День освобождения
    - 2026-08-17 # Перенос
    - 2026-09-24 # Chuseok
    - 2026-09-25
    - 2026-09-26
    - 2026-10-03 # День основания государства
    - 2026-10-05 # Перенос
    - 2026-10-09 # День хангыля
    - 2026-12-25 # Рождество
  verified_holiday_years: [2026]
cleaning:
  policy: next_hour_slot
  duration_minutes: 60
  weekly:
    MON:
    # null — расписание ещё не задано; [] — уборки в этот день нет.
      - from: "09:00"
        to: "10:00"
      - from: "14:00"
        to: "15:00"
    TUE:
      - from: "09:00"
        to: "10:00"
      - from: "14:00"
        to: "15:00"
    WED:
      - from: "09:00"
        to: "10:00"
      - from: "14:00"
        to: "15:00"
    THU:
      - from: "09:00"
        to: "10:00"
      - from: "14:00"
        to: "15:00"
    FRI:
      - from: "09:00"
        to: "10:00"
      - from: "14:00"
        to: "15:00"
    SAT:
      - from: "09:00"
        to: "10:00"
      - from: "14:00"
        to: "15:00"
    SUN:
      - from: "09:00"
        to: "10:00"
      - from: "14:00"
        to: "15:00"
payment:
  deposit_amount: 50000
  bank: "Bank name"
  account_number: "30..."
  account_holder: "NAME"
