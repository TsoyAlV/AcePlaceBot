# Основные бизнес-настройки Ace Place. Секреты API остаются в .env.
timezone: Asia/Seoul
welcome:
  website_url: "https://151.243.177.216/"
  image_path: "assets/telegram/aceplace-start-cover-v1.png"
calendar:
  json_dir: secrets/calendars
  enabled: true
  booking_color_id: "9"
  cleaning_color_id: "6"
  block_color_id: "8"
currency: KRW
cancellation:
  deposit_refundable_before_cutoff: false # Для новых броней предоплата не возвращается при отмене.
  refund_cutoff_hours: 72 # Только для ранее согласованных условий с возвратом предоплаты.
reviews:
  enabled: true
  url: "https://t.me/AcePlaceParty/112"
  catch_up_hours: 24 # Доставить ранее назначенное сообщение после простоя, если прошло не более 24 часов.
  ru:
    link_text: "⭐ Оставить отзыв"
    message: |-
      Спасибо, что выбрали AcePlace! 🎉
      Надеемся, вы отлично провели время.

      Поделитесь впечатлениями — ваш отзыв поможет нам стать лучше и другим гостям выбрать место для своего мероприятия.

      {review_link}

      Будем рады видеть вас снова! 💛
  ko:
    link_text: "⭐ 후기 남기기"
    message: |-
      AcePlace를 이용해 주셔서 감사합니다! 🎉
      즐거운 시간 보내셨기를 바랍니다.

      이용 후기를 남겨 주세요. 여러분의 후기는 더 나은 서비스를 만드는 데 도움이 되고, 다른 손님들이 행사 장소를 선택하는 데에도 큰 도움이 됩니다.

      {review_link}

      다시 뵙기를 기다리겠습니다! 💛
  en:
    link_text: "⭐ Leave a review"
    message: |-
      Thank you for choosing AcePlace! 🎉
      We hope you had a wonderful time.

      Share your experience — your feedback helps us improve and helps other guests choose a place for their event.

      {review_link}

      We look forward to welcoming you again! 💛
notifications:
  cleaning:
    hours_before: 2 # За сколько часов до назначенной уборки уведомлять администраторов.
    telegram_enabled: true
visit:
  # Отправляется клиенту вместе с подтверждением брони.
  # Kakao Map: открыть адрес и построить маршрут.
  ru:
    route_url: "https://kko.to/Hn6onZrkRD"
    address: '경기 안산시 단원구 중앙대로 829 — здание свадебного зала «The Luce», этаж B1.'
    entry_instructions: |-
      На этаже B1 после выхода из лифта поверните направо.

      Парковка находится в этом же здании на этажах B2 и B3.
      Зарегистрируйте автомобиль в управляющем офисе (관리사무실) до 17:00, пока он работает.
      После регистрации первые 4 часа парковки бесплатны, далее — 600 ₩ за каждые 30 минут.
  ko:
    route_url: "https://kko.to/Hn6onZrkRD"
    address: '경기 안산시 단원구 중앙대로 829, "The Luce" 웨딩홀 건물 지하 1층(B1).'
    entry_instructions: |-
      지하 1층(B1)에서 엘리베이터를 내린 후 오른쪽으로 오시면 됩니다.

      주차장은 같은 건물 지하 2층(B2)과 지하 3층(B3)에 있습니다.
      관리사무실 운영 시간인 오후 5시(17:00)까지 차량을 등록해 주세요.
      차량 등록 시 최초 4시간 무료이며, 이후 30분당 600원이 부과됩니다.
  en:
    address: '경기 안산시 단원구 중앙대로 829 — The Luce Wedding Hall building, basement level B1.'
    route_url: "https://kko.to/Hn6onZrkRD"
    entry_instructions: |-
      On level B1, turn right when leaving the lift.

      Parking is in the same building on basement levels B2 and B3.
      Register your vehicle at the management office (관리사무실) before 17:00, while it is open.
      After registration, the first 4 hours are free; each additional 30 minutes costs 600 ₩.
booking:
  minimum_hours: 5
  start_step_minutes: 60
  confirmation_timeout_minutes: 1440
  hold_timeout_minutes: 10
pricing:
  base_hours: 5
  weekday_base_amount: 150000
  weekday_extra_hour_amount: 10000
  weekend_holiday_base_amount: 200000
  weekend_holiday_extra_hour_amount: 20000
  weekend_days: [SAT, SUN]
  # Вся аренда и дополнительные часы — по дате начала в Сеуле.
  date_policy: start_date
  # Праздники KR и переносы определяются автоматически библиотекой holidays.
  # Дополнительные даты можно добавлять сюда; прежний список сохранён.
  holiday_dates:
    - 2026-01-01 # Новый год
    - 2026-02-16 # Seollal
    - 2026-02-17
    - 2026-02-18
    - 2026-03-01 # День движения за независимость
    - 2026-03-02 # Перенос
    - 2026-05-01 # День труда
    - 2026-05-05 # День детей
    - 2026-05-24 # День рождения Будды
    - 2026-05-25 # Перенос
    - 2026-06-03 # Местные выборы
    - 2026-06-06 # День памяти
    - 2026-07-17 # День конституции
    - 2026-08-15 # День освобождения
    - 2026-08-17 # Перенос
    - 2026-09-24 # Chuseok
    - 2026-09-25
    - 2026-09-26
    - 2026-10-03 # День основания государства
    - 2026-10-05 # Перенос
    - 2026-10-09 # День хангыля
    - 2026-12-25 # Рождество
    - 2026-12-31 # Старый-новый год
